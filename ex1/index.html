<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Équation Quadratique</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Résolveur d'équation quadratique</h1>
    <form id="quadratic-form">
      <input type="number" id="a" placeholder="Coefficient a" required />
      <input type="number" id="b" placeholder="Coefficient b" required />
      <input type="number" id="c" placeholder="Coefficient c" required />
      <button type="submit">Résoudre</button>
    </form>
    <p id="result"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
